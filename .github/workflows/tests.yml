name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install unit-test harness (no Hermes credentials)
        run: python -m pip install -r requirements-test.txt
      - name: Python unit and direct-router tests (not host-auth proof)
        run: python -m unittest discover -s tests -v

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Public-shaped Dashboard preview tests
        run: node --test tests/*.cjs

# Task 3 adds the deterministic UI build/check alongside its shared UI suite.
# These jobs do not install into a live Hermes host or run paid inference.
