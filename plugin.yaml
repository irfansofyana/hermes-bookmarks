name: hermes-bookmarks
version: "0.1.0"
description: Shared bookmark capture and search for Hermes Desktop, Dashboard and native tools; development preview
python_dependencies:
  - "Pillow==12.3.0"
  - "python-multipart==0.0.32"
provides_tools:
  - bookmark_attachment_add
  - bookmark_attachment_get
  - bookmark_save
  - bookmark_delete
  - bookmark_restore
  - bookmark_get
  - bookmark_search
  - bookmark_update
  - bookmark_note_update
  - bookmark_capture_status
  - bookmark_collection_list
  - bookmark_collection_create
  - bookmark_collection_update
  - bookmark_collection_delete
  - bookmark_tag_list
  - bookmark_library_identity
  - bookmark_import_preview
  - bookmark_import_start
  - bookmark_import_request_get
  - bookmark_job_get
  - bookmark_job_cancel
  - bookmark_counts
  - bookmark_export_create
  - bookmark_export_get
  - bookmark_export_read
  - bookmark_backup_upload_create
  - bookmark_backup_upload_chunk
  - bookmark_backup_preview
  - bookmark_backup_restore
  - bookmark_backup_restore_get
provides_hooks: []
